<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="商链">
<title>商链 BizChain</title>
<style>
/* Layout: phone-shaped app column — sticky top bar, two-column note feed, bottom tab bar; brand data opens as a full sheet */
:root{
  --bg:#FFFFFF; --surface:#F6F6F4; --ink:#1B1B1F; --muted:#8A8A91; --line:#E6E6E3; --soft:#4A4A52;
  --gold:#D2364B; --seal:#F0455A; --chip:#FDEBED; --good:#2f7a4f; --goodbg:#e3f1e8; --svc:#2b5ea7; --svcfg:#ffffff;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --display:var(--body); --mono:var(--body);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121214; --surface:#1E1E22; --ink:#EDEDEF; --muted:#9A9AA1; --line:#2C2C31; --soft:#C4C4CA;
  --gold:#FF7A8A; --seal:#F0455A; --chip:#3A1E23; --good:#6cc28f; --goodbg:#1f3328; --svc:#7ea6e8; --svcfg:#0f1520; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121214; --surface:#1E1E22; --ink:#EDEDEF; --muted:#9A9AA1; --line:#2C2C31; --soft:#C4C4CA;
  --gold:#FF7A8A; --seal:#F0455A; --chip:#3A1E23; --good:#6cc28f; --goodbg:#1f3328; --svc:#7ea6e8; --svcfg:#0f1520; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-inline:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:84px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 16px 6px;display:flex;flex-direction:column;gap:8px}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-weight:700;font-size:20px;letter-spacing:.02em;display:flex;align-items:baseline;gap:8px}
.logo small{font-size:11px;font-weight:500;color:var(--seal);letter-spacing:.12em}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border-radius:999px;padding:9px 14px;color:var(--muted)}
.search input{border:0;background:none;flex:1;min-width:0;font:inherit;color:var(--ink);outline:none}
.tabs{display:flex;gap:22px;align-items:flex-end;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:6px 0 4px;color:var(--muted);white-space:nowrap;font-size:16px;border-bottom:3px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);font-weight:700;font-size:18px;border-color:var(--seal)}
main{padding:12px 10px}
.feed{columns:2;column-gap:8px}
.card{break-inside:avoid;margin-bottom:8px;background:var(--surface);border-radius:10px;overflow:hidden;display:block;width:100%;text-align:left}
.cover{padding:14px 12px;display:flex;flex-direction:column;justify-content:flex-end;font-weight:700;line-height:1.35;color:#1B1B1F;font-size:17px;text-wrap:balance}
.cover .kicker{font-size:11px;letter-spacing:.1em;opacity:.55;margin-bottom:6px;font-weight:500}
.cbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.ctitle{font-weight:500;font-size:14px;line-height:1.45}
.bchip{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--chip);color:var(--gold);font-size:11.5px;padding:3px 8px;border-radius:6px;font-weight:500}
.bchip b{font-family:var(--mono);font-weight:500}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.meta .lk{display:inline-flex;align-items:center;gap:3px}
.av{display:inline-flex;align-items:center;gap:6px;min-width:0}
.av i{width:18px;height:18px;border-radius:50%;display:inline-block;background:var(--gold);flex:none}
.av span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav>div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:60px}
.nav button{font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;height:52px;justify-content:center}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav .plus{justify-self:center;width:52px;height:36px;border-radius:12px;background:var(--seal);color:#fff}
.note{font-size:11.5px;color:var(--muted);text-align:center;padding:14px 8px 4px}
/* brand list */
.blist{display:flex;flex-direction:column;gap:8px}
.brow{background:var(--surface);border-radius:12px;padding:14px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%}
.mono{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#fff;font-size:18px}
.brow h3{margin:0;font-size:15px}
.brow p{margin:3px 0 0;color:var(--muted);font-size:12px}
.brow .fig{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink)}
.brow .fig small{display:block;color:var(--muted);font-family:var(--body);font-size:11px}
.filters{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -10px 10px;padding:2px 10px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:6px 14px;border-radius:999px;background:var(--surface);font-size:13px;color:var(--soft);white-space:nowrap}
.fwrap{position:relative}
.filters{cursor:grab;user-select:none}
.farrow{position:absolute;top:0;height:32px;width:44px;display:flex;align-items:center;font-size:20px;color:var(--ink);z-index:1}
.farrow.r{right:-10px;justify-content:flex-end;padding-right:8px;background:linear-gradient(to right,transparent,var(--bg) 55%)}
.farrow.l{left:-10px;justify-content:flex-start;padding-left:8px;background:linear-gradient(to left,transparent,var(--bg) 55%)}
.filters button small{font-size:11px;margin-left:4px;opacity:.6}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:500}
/* sheets */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto}
.sheet .inner{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 40px}
.sbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 12px}
.back{font-size:15px;color:var(--muted)}
.hero{border-radius:14px;padding:20px 18px;color:#fff;display:flex;flex-direction:column;gap:6px}
.hero h2{margin:0;font-family:var(--display);font-weight:700;font-size:26px}
.hero p{margin:0;opacity:.85;font-size:13px}
.follow{align-self:flex-start;margin-top:6px;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:5px 14px;font-size:13px}
.prof{background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.prow{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center}
.pav{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:700;font-size:24px}
.pid{min-width:0}.pid h2{margin:0;font-family:var(--display);font-weight:700;font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pid p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.prof .follow{background:var(--seal);color:#fff;margin:0;align-self:center}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.pstats b{display:block;font-family:var(--mono);font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstats span{font-size:11px;color:var(--muted)}
.pbio{font-size:13.5px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbio.open{display:block}
.more{align-self:flex-start;font-size:12.5px;color:var(--gold);margin-top:-6px}
.ptags{display:flex;flex-wrap:wrap;gap:6px}.ptags span{font-size:12px;color:var(--gold);background:var(--chip);padding:2px 8px;border-radius:999px}
.ptags .src{color:var(--muted);background:transparent;border:1px solid var(--line)}
.jump{position:sticky;top:0;z-index:2;display:flex;gap:18px;background:var(--bg);padding:12px 2px 8px;margin-top:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.jump button{color:var(--muted);font-size:14.5px;white-space:nowrap;padding:4px 0;border-bottom:2px solid transparent}.jump button[aria-selected="true"]{color:var(--ink);font-weight:700;border-color:var(--seal)}
.bpanel{margin-top:4px}
.sec{scroll-margin-top:52px}
.trend{background:var(--surface);border-radius:12px;padding:14px}
.bars{display:grid;grid-template-columns:repeat(4,1fr);align-items:end;gap:10px;height:120px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar i{display:block;width:60%;max-width:46px;background:var(--gold);border-radius:4px 4px 0 0;opacity:.55}
.bar:last-child i{opacity:1}
.bv{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}.by{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tsum{margin:10px 0 0;font-size:13px}.tsum.up b{color:var(--good)}.tsum.down b{color:var(--seal)}
.rev{background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rev p{margin:0;font-size:14px;line-height:1.6}
.pill{align-self:flex-start;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:500}
.rev.yes .pill{background:var(--goodbg);color:var(--good)}.rev.no .pill{background:var(--chip);color:var(--seal)}
.sim{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.simc{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.simc .mono{width:32px;height:32px;font-size:14px;border-radius:8px;margin-bottom:4px}
.simc b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.simc span{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpis div{display:flex;flex-direction:column;gap:2px}.kpis span{font-size:12px;color:var(--muted)}
.kpis b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}.kpis small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.range{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.track{position:relative;height:10px;border-radius:999px;background:linear-gradient(to right,var(--chip),var(--gold))}
.mk{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;transform:translateX(-50%)}
.mk.avg,.dot.avg{background:var(--ink)}.mk.med,.dot.med{background:var(--seal)}
.rlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.above{margin:0;font-size:13px}.basis{margin:0;font-size:12px;color:var(--muted)}
.gt{margin:16px 0 8px;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.dist{background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.drow{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;font-size:12.5px}
.db{height:10px;background:var(--chip);border-radius:3px;overflow:hidden}.db i{display:block;height:100%;background:var(--gold)}
.dn{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.prof{padding:0 0 16px;overflow:hidden}
.prof>*:not(.pcover){margin-inline:16px}
.pcover{height:110px;background-size:cover;background-position:center;position:relative;margin:0}
.pedit{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.42);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px}
.prof .prow{margin-top:-6px;align-items:end}
.prof .prow .pav{margin-top:-34px;position:relative;z-index:1}
.prof .prow .pid,.prof .prow .follow{padding-bottom:2px}
.pav{border:3px solid var(--surface);box-sizing:content-box}
.avimg{background-size:cover;background-position:center;color:transparent}
.idea{background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.idea blockquote{margin:0;font-family:var(--display);font-weight:700;font-size:19px;line-height:1.45;text-wrap:balance;border-left:3px solid var(--seal);padding-left:12px}
.vals{display:flex;flex-wrap:wrap;gap:6px}.vals span{background:var(--chip);color:var(--gold);font-size:13px;padding:4px 10px;border-radius:999px}
.story{font-size:14.5px;line-height:1.8;white-space:pre-wrap}.byb{margin:0;font-size:11.5px;color:var(--muted)}
.ideaempty{background:var(--surface);border-radius:12px;padding:20px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ideaempty p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6}.ideaempty .dm{margin-top:4px}
.edcover{height:120px;border-radius:12px;background-size:cover;background-position:center;position:relative}
.pick{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.5);color:#fff;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;flex-direction:row}
.edav{display:flex;align-items:center;gap:12px;margin-top:-34px;padding-left:12px;position:relative;z-index:1}
.edav .pick{position:static}.pick.dark{background:var(--ink);color:var(--bg);margin-top:28px}
.edh{margin:8px 0 0;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.vb{display:inline-flex;align-items:center;font-size:10.5px;line-height:1;padding:3px 6px;border-radius:999px;font-weight:700;margin-left:5px;vertical-align:middle;white-space:nowrap;font-family:var(--body)}
.vb.brand,.vbi.brand{background:var(--seal);color:#fff}.vb.svc,.vbi.svc{background:var(--svc);color:var(--svcfg)}
.vbi{display:inline-grid;place-items:center;width:13px;height:13px;border-radius:50%;font-size:8.5px;font-weight:700;margin-left:4px;flex:none}
.pverified{position:absolute;top:10px;right:10px;background:var(--surface);color:var(--seal);font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.pverified.no{color:var(--muted);font-weight:500}
.pverified.svcv{color:var(--svc)}
.cmts{margin-top:22px;border-top:1px solid var(--line);padding-top:14px}.cmts h4{margin:0 0 10px;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.cmt{display:grid;grid-template-columns:30px 1fr;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cav{width:30px;height:30px;border-radius:50%;display:block}.cname{font-size:13px;color:var(--muted);display:flex;align-items:center;flex-wrap:wrap}
.cmt p{margin:4px 0 0;font-size:14.5px;line-height:1.6}
.cform{flex-direction:row;gap:8px;margin-top:12px}.cform input{flex:1;min-width:0;border-radius:999px}.cform button{background:var(--seal);color:#fff;border-radius:999px;padding:0 16px;font-weight:500}
.plans{display:flex;flex-direction:column;gap:8px}
.plan{background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line)}
.plan b{font-size:15px;display:flex;align-items:center;flex-wrap:wrap;gap:2px}.plan .price{font-size:12.5px;color:var(--gold);font-weight:500}
.plan ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--muted);line-height:1.7}
.plan.hl{border-color:var(--gold)}
.rolepick{display:flex;flex-direction:column;gap:6px;background:var(--surface);border-radius:12px;padding:12px 14px}
[hidden]{display:none!important}
.pacts{align-items:center}.pown{display:flex;margin-right:auto}.pown .pact{padding:8px 10px}
.menu{display:flex;flex-direction:column;background:var(--surface);border-radius:12px;overflow:hidden;margin-top:8px}
.menu button{padding:15px 16px;text-align:left;font-size:15px;border-bottom:1px solid var(--line)}.menu button:last-child{border-bottom:0}
.menu .danger,.confirm .danger{color:#C0392B}.confirm .submit.danger{background:#C0392B;color:#fff}
.confirm{display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:14px;padding:20px 16px;margin-top:8px}.confirm b{font-size:17px}.confirm p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6}
.h1en{font-size:20px;color:var(--muted);font-weight:500}
.seg{display:flex;background:var(--surface);border-radius:10px;padding:3px;gap:3px}.seg button{flex:1;padding:9px;border-radius:8px;font-size:14px;color:var(--soft)}.seg button[aria-pressed="true"]{background:var(--bg);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.onbalt{display:flex;justify-content:space-between;margin-top:18px}
.linkbtn{font-size:14px;color:var(--gold);padding:8px 0}
.logincard{background:var(--surface);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:10px;margin-top:8px}
.logincard b{font-size:18px}.logincard p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.6}
.pendbar{background:var(--chip);color:var(--gold);border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px;font-weight:700;display:flex;flex-direction:column;gap:3px}
.pendbar small{font-weight:400;color:var(--soft);font-size:12.5px}.pendbar.rejected{background:var(--surface);color:var(--ink)}
.jump.even{gap:0}.jump.even button{flex:1;text-align:center}
.lk.on{color:var(--seal)}.lk.on svg{fill:var(--seal);stroke:var(--seal)}
.pacts{position:sticky;bottom:0;display:flex;justify-content:space-around;background:var(--bg);border-top:1px solid var(--line);margin:20px -16px -40px;padding:8px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.pact{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--soft);padding:8px 14px;min-height:44px}
.pact.on{color:var(--seal)}.pact.on svg{fill:var(--seal);stroke:var(--seal)}
.follow.ghost{background:transparent;color:var(--muted);border:1px solid var(--line)}
.mycmts{display:flex;flex-direction:column;gap:8px}
.mycmt{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--surface);border-radius:12px;padding:12px 14px;width:100%}
.mycmt p{margin:0;font-size:14.5px;line-height:1.6}.mycmt span{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lbl{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
.bpick{display:flex;flex-direction:column;gap:6px;color:var(--ink)}
.pkbox{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:0 12px;color:var(--muted)}
.pkbox:focus-within{outline:2px solid var(--gold);outline-offset:1px}.pkbox input.pkq:focus-visible{outline:none}
.pkbox input.pkq{border:0;background:none;padding:10px 0;flex:1;min-width:0;border-radius:0}
.pkres{display:flex;flex-direction:column;border-radius:10px;overflow:hidden;border:1px solid var(--line)}.pkres:empty{display:none}
.pkrow,.pksel{display:flex;align-items:center;gap:10px;padding:10px 12px;text-align:left;width:100%;background:var(--bg);border-bottom:1px solid var(--line)}
.pkrow:last-child{border-bottom:0}.pkrow:hover{background:var(--surface)}
.pksel{border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.pkrow .mono,.pksel .mono{width:36px;height:36px;font-size:15px;border-radius:8px;flex:none}
.pkname{display:flex;flex-direction:column;min-width:0;flex:1}.pkname b{font-size:14.5px}.pkname small{font-size:12px;color:var(--muted)}
.pkadd .pkname b{color:var(--gold)}.pknone{margin:0;padding:10px 12px;font-size:13px;color:var(--muted)}
.pkchg{font-size:13px;color:var(--gold);flex:none}
.sbar{gap:8px}.sbar .stitle{flex:1;text-align:center}
.sacts{display:flex;align-items:center;gap:6px}
.ticon.share{margin-right:-8px;flex:none}
.usmap{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 12px}

<script>
// ───────── Cloud (Supabase) ─────────
// Brands, notes, comments, likes, saves, follows, DMs and profiles live in Supabase.
// If the database can't be reached, the app keeps working on the data built into the page (browse only).
const SB_URL="https://yqbyhmymvllmrksgfsmo.supabase.co",SB_KEY="sb_publishable_Pnh-5WCfBBQd8PYKhqBmuw_PBlBMJzd";
let sb=null;
Object.assign(S,{cloud:false,uid:null,email:"",cloudPosts:[],people:{},myVer:null,verBrands:[],busyAuth:false,pendFile:null});
const AVATARS={};
const isUuid=id=>/^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/.test(String(id));
const STRF=["name","cn","cat","units","fee","royalty","ad","invest","to_franchisor","term","program","note","tagline","bio","item19","fdd_year","source","units_as_of"];
const pname=id=>(S.people[id]||{}).name||L("用户","User");
const GUEST=()=>({name:L("游客","Guest"),role:"user"});
function fmtTime(ts){const d=new Date(ts),n=new Date();if(d.toDateString()===n.toDateString())return d.toTimeString().slice(0,5);const days=Math.floor((n-d)/864e5);return days<7?(S.lang==="en"?["Sun","Mon","Tue","Wed","Thu","Fri","Sat"]:["周日","周一","周二","周三","周四","周五","周六"])[d.getDay()]:`${d.getMonth()+1}/${d.getDate()}`}
function needAuth(msg){if(S.cloud&&!S.uid){toast(msg||L("登录后才能操作","Please log in first"));closeSheet();openOnb("login");return true}return false}
function cloudErr(e,what){console.error(what,e);toast(L((what||"操作")+"没成功：","Couldn’t "+({"同步":"sync","评论":"comment","发布":"post","发起私信":"start the chat","发送":"send","保存":"save","上传":"upload","删除":"delete"}[what]||"do that")+": ")+((e&&e.message)||L("网络问题，稍后再试","network problem, try again later")))}
const siteURL=()=>location.href.split("#")[0].split("?")[0];

async function cloudInit(){
 if(!window.supabase||!window.supabase.createClient)return false;
 try{sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,detectSessionInUrl:true}})}catch(e){return false}
 const {data:bs,error}=await sb.from("brands").select("*").order("name");
 if(error){console.warn("Supabase unreachable, using built-in data",error);sb=null;return false}
 S.cloud=true;
 if(bs&&bs.length){BRANDS.length=0;bs.forEach(b=>{STRF.forEach(k=>{if(b[k]==null)b[k]=""});b.tags=b.tags||[];b.c=b.color||0;BRANDS.push(b)})}
 await loadBrandPages();
 const {data:{session}}=await sb.auth.getSession();
 if(session)await loadMe(session.user);else S.me=GUEST();
 sb.auth.onAuthStateChange((ev,s)=>{
  if(ev==="PASSWORD_RECOVERY"){setTimeout(openReset,0);return}
  if(ev==="SIGNED_IN"&&s&&!S.busyAuth&&S.uid!==s.user.id){setTimeout(async()=>{await loadMe(s.user);await loadAll();$("#onb").hidden=true;render()},0)}
  if(ev==="SIGNED_OUT"){S.uid=null;S.me=GUEST();S.liked=[];S.saved=[];S.follows=[];S.threads=[];render()}});
 await loadAll();return true}

async function loadBrandPages(){
 const [{data:pages},{data:vb}]=await Promise.all([sb.from("brand_pages").select("*"),sb.from("profiles").select("brand_id").eq("role","brand").eq("verified",true)]);
 S.edits={};(pages||[]).forEach(p=>{const e={};if(p.avatar_url)e.avatar=p.avatar_url;if(p.cover_url)e.cover=p.cover_url;if(p.tagline)e.tagline=p.tagline;if(p.intro)e.bio=p.intro;if(p.philosophy)e.philosophy=p.philosophy;S.edits[p.brand_id]=e});
 S.verBrands=(vb||[]).map(x=>x.brand_id).filter(Boolean)}

function profToMe(p){return {name:p.name,role:p.role,verified:p.verified,admin:p.is_admin,stage:p.stage||"",region:p.region||"",intro:p.intro||"",interests:p.interests||[],avatar:p.avatar_url||undefined,cover:p.cover_url||undefined,brand:p.brand_id||null,svc:p.svc_type||"",org:p.org||"",tagline:p.tagline||"",specialties:p.specialties||[],services:p.services||[]}}

async function loadMe(user){
 S.uid=user.id;S.email=user.email||"";
 let {data:p}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
 const pend=readPending();
 if(pend&&p){await applyPending(pend,p);({data:p}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle())}
 S.me=p?profToMe(p):{name:S.email||L("用户","User"),role:"user"};
 if(p){S.people[p.id]=p;USERS[p.name]={role:p.verified?p.role:"user",svc:p.svc_type,brand:p.brand_id};if(p.avatar_url)AVATARS[p.name]=p.avatar_url}
 S.onb=true;try{localStorage.setItem("bc-onb","1")}catch(e){}
 const {data:vr}=await sb.from("verification_requests").select("*").eq("user_id",user.id).order("created_at",{ascending:false}).limit(1);
 S.myVer=vr&&vr[0]||null}

function readPending(){try{return JSON.parse(localStorage.getItem("bc-pending")||"null")}catch(e){return null}}
async function applyPending(pd,p){
 const upd={name:pd.name||p.name,role:pd.role||"user",stage:pd.stage||null,region:pd.region||null,org:pd.org||null,svc_type:pd.svc||null,brand_id:pd.brand||null};
 const r=await sb.from("profiles").update(upd).eq("id",p.id);if(r.error)console.error(r.error);
 if(pd.role==="brand"||pd.role==="service"){
  const {data:ex}=await sb.from("verification_requests").select("id").eq("user_id",p.id).limit(1);
  if(!ex||!ex.length){let doc=null;if(S.pendFile){doc=await upVerify(S.pendFile,p.id).catch(e=>{console.error(e);return null})}
   const r2=await sb.from("verification_requests").insert({user_id:p.id,kind:pd.role,brand_id:pd.brand||null,new_brand:pd.newBrand||null,svc_type:pd.svc||null,contact_name:pd.contact||null,title:pd.title||null,doc_path:doc});
   if(r2.error)console.error(r2.error)}}
 S.pendFile=null;try{localStorage.removeItem("bc-pending")}catch(e){}}

async function loadPeople(ids){ids=[...new Set(ids)].filter(id=>id&&!S.people[id]);if(!ids.length)return;
 const {data}=await sb.from("profiles").select("id,name,role,verified,svc_type,brand_id,avatar_url,is_admin").in("id",ids);
 (data||[]).forEach(p=>{S.people[p.id]=p;USERS[p.name]={role:p.verified?p.role:"user",svc:p.svc_type,brand:p.brand_id};if(p.avatar_url)AVATARS[p.name]=p.avatar_url})}

async function loadAll(){if(!sb)return;
 const {data:ps,error}=await sb.from("posts").select("*").order("created_at",{ascending:false}).limit(300);
 if(error){console.error(error);return}
 const ids=(ps||[]).map(p=>p.id);
 const [{data:cs},{data:ls}]=await Promise.all([ids.length?sb.from("comments").select("*").in("post_id",ids).order("created_at"):{data:[]},ids.length?sb.from("likes").select("post_id,user_id").in("post_id",ids):{data:[]}]);
 const uids=[...(ps||[]).map(p=>p.author),...(cs||[]).map(c=>c.author)];
 let convs=[];
 if(S.uid){const {data:cv}=await sb.from("conversations").select("*").order("created_at",{ascending:false});
  const cids=(cv||[]).map(c=>c.id);const {data:ms}=cids.length?await sb.from("messages").select("*").in("conversation_id",cids).order("created_at"):{data:[]};
  (cv||[]).forEach(c=>uids.push(c.a===S.uid?c.b:c.a));convs=(cv||[]).map(c=>({c,ms:(ms||[]).filter(m=>m.conversation_id===c.id)}))}
 await loadPeople(uids);
 const cnt={};(ls||[]).forEach(l=>cnt[l.post_id]=(cnt[l.post_id]||0)+1);
 const myLikes=S.uid?(ls||[]).filter(l=>l.user_id===S.uid).map(l=>l.post_id):[];
 S.cloudPosts=(ps||[]).map(p=>({id:p.id,ch:p.channel,brand:p.brand_id,c:p.color||0,kicker:p.kicker,cover:p.cover_text||"",title:p.title,body:p.body,user:pname(p.author),uid:p.author,likes:(cnt[p.id]||0)-(myLikes.includes(p.id)?1:0),cloud:true}));
 ids.forEach(id=>{S.comments[id]=(cs||[]).filter(c=>c.post_id===id).map(c=>({user:pname(c.author),text:c.body,id:c.id}))});
 const local=a=>a.filter(x=>!isUuid(x));
 if(S.uid){const [{data:sv},{data:fl}]=await Promise.all([sb.from("saves").select("post_id").order("created_at",{ascending:false}),sb.from("follows").select("brand_id").order("created_at",{ascending:false})]);
  S.liked=[...myLikes,...local(S.liked)];S.saved=[...(sv||[]).map(x=>x.post_id),...local(S.saved)];S.follows=(fl||[]).map(x=>x.brand_id);
  S.threads=convs.map(({c,ms})=>threadObj(c,ms))}
 else{S.liked=local(S.liked);S.saved=local(S.saved);S.follows=[];S.threads=[]}}

function threadObj(c,ms){const o=c.a===S.uid?c.b:c.a,last=ms[ms.length-1],nm=pname(o);
 return {id:c.id,cloud:true,other:o,name:nm,c:nm.length%6,brand:c.brand_id,time:fmtTime(last?last.created_at:c.created_at),msgs:ms.map(m=>({me:m.sender===S.uid,t:m.body}))}}

// ── uploads ──
async function upMedia(dataUrl,kind){if(!dataUrl||!dataUrl.startsWith("data:"))return dataUrl||null;
 const blob=await (await fetch(dataUrl)).blob(),path=`${S.uid}/${kind}-${Date.now()}.jpg`;
 const {error}=await sb.storage.from("media").upload(path,blob,{contentType:"image/jpeg",upsert:true});if(error)throw error;
 return sb.storage.from("media").getPublicUrl(path).data.publicUrl}
async function upVerify(file,uid){const safe=file.name.replace(/[^\w.\-]+/g,"_").slice(-60),path=`${uid||S.uid}/${Date.now()}-${safe}`;
 const {error}=await sb.storage.from("verify").upload(path,file,{upsert:false});if(error)throw error;return path}

// ── actions (called from the page's handlers when S.cloud) ──
async function cToggle(tbl,col,val,on){const r=on?await sb.from(tbl).insert({user_id:S.uid,[col]:val}):await sb.from(tbl).delete().eq("user_id",S.uid).eq(col,val);if(r.error)cloudErr(r.error,"同步")}
async function cComment(pid,text){const {data,error}=await sb.from("comments").insert({post_id:pid,author:S.uid,body:text}).select().single();if(error){cloudErr(error,"评论");return false}
 (S.comments[pid]=S.comments[pid]||[]).push({user:S.me.name,text,id:data.id});return true}
async function cPost(p){const {data,error}=await sb.from("posts").insert({author:S.uid,channel:p.ch,brand_id:p.brand,kicker:p.kicker,cover_text:p.cover,title:p.title,body:p.body,color:p.c}).select().single();
 if(error){cloudErr(error,"发布");return false}S.cloudPosts.unshift({...p,id:data.id,uid:S.uid,cloud:true,likes:0});return true}
async function cUpdatePost(id,f){const {error}=await sb.from("posts").update({channel:f.ch,brand_id:f.brand,color:f.c,cover_text:f.cover,title:f.title,body:f.body}).eq("id",id).eq("author",S.uid);if(error){cloudErr(error,"保存");return false}return true}
async function cDeletePost(id){const {error}=await sb.from("posts").delete().eq("id",id).eq("author",S.uid);if(error){cloudErr(error,"删除");return false}S.cloudPosts=S.cloudPosts.filter(p=>p.id!==id);delete S.comments[id];return true}
async function cOpenDM(otherId,brand){if(otherId===S.uid){toast(L("这是你自己","That’s you"));return}
 let t=S.threads.find(x=>x.cloud&&x.other===otherId);
 if(!t){const {data,error}=await sb.from("conversations").insert({a:S.uid,b:otherId,brand_id:brand||null}).select().single();if(error){cloudErr(error,"发起私信");return}
  await loadPeople([otherId]);t=threadObj(data,[]);S.threads.unshift(t)}
 else if(brand)t.brand=brand;
 render();openThread(t.id)}
async function cSend(t,text){const {error}=await sb.from("messages").insert({conversation_id:t.id,sender:S.uid,body:text});if(error){cloudErr(error,"发送");return false}return true}
async function cRefreshThread(id){const t=S.threads.find(x=>x.id===id);if(!t||!t.cloud)return;
 const {data:ms}=await sb.from("messages").select("*").eq("conversation_id",id).order("created_at");if(!ms)return;
 if(ms.length!==t.msgs.length){t.msgs=ms.map(m=>({me:m.sender===S.uid,t:m.body}));if(ms.length)t.time=fmtTime(ms[ms.length-1].created_at);if(S.thread===id){openThread(id)}}}
setInterval(()=>{if(S.cloud&&S.uid&&S.thread)cRefreshThread(S.thread)},6000);
async function cAdvisor(brand){const {data}=await sb.from("profiles").select("id,name,role,verified,svc_type,brand_id,avatar_url,is_admin").eq("is_admin",true).limit(1);
 if(!data||!data.length){toast(L("顾问咨询马上开放","Advisor chat is coming soon"));return}S.people[data[0].id]=data[0];await cOpenDM(data[0].id,brand)}
async function cSaveProfile(extra){const me=S.me;
 try{const av=await upMedia(me.avatar,"avatar"),cv=await upMedia(me.cover,"cover");me.avatar=av||undefined;me.cover=cv||undefined;
  const {error}=await sb.from("profiles").update({name:me.name,stage:me.stage||null,region:me.region||null,intro:me.intro||null,interests:me.interests||[],avatar_url:av,cover_url:cv,org:me.org||null,tagline:me.tagline||null,specialties:me.specialties||[],services:me.services||[],...(extra||{})}).eq("id",S.uid);
  if(error)throw error;S.people[S.uid]=Object.assign(S.people[S.uid]||{},{name:me.name,avatar_url:av});if(av)AVATARS[me.name]=av;
  S.cloudPosts.forEach(p=>{if(p.uid===S.uid)p.user=me.name});return true}catch(e){cloudErr(e,"保存");return false}}
async function cSaveBrandPage(id,e){try{const av=await upMedia(e.avatar,"brand-avatar"),cv=await upMedia(e.cover,"brand-cover");e.avatar=av||undefined;e.cover=cv||undefined;
  const {error}=await sb.from("brand_pages").upsert({brand_id:id,avatar_url:av,cover_url:cv,tagline:e.tagline||null,intro:e.bio||null,philosophy:e.philosophy||null,updated_by:S.uid});
  if(error)throw error;return true}catch(err){cloudErr(err,"保存");return false}}

// ── sign up / log in ──
const credHTML=()=>S.cloud?`<label>${T("邮箱")}<input type="email" id="oem" required autocomplete="email" placeholder="${S.lang==="en"?"Used to log in and reset your password":"用来登录和找回密码"}"></label><label>${S.lang==="en"?"Password (at least 6 characters)":"密码（至少 6 位）"}<input type="password" id="opw" minlength="6" required autocomplete="new-password"></label>`:"";
async function signUpFlow(pd){
 const email=$("#oem").value.trim(),password=$("#opw").value,btn=document.querySelector("#onb .submit");btn.disabled=true;const lab=btn.textContent;btn.textContent=L("提交中…","Submitting…");
 S.busyAuth=true;const {file,...rest}=pd;S.pendFile=file||null;try{localStorage.setItem("bc-pending",JSON.stringify(rest))}catch(e){}
 const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:pd.name,lang:S.lang==="en"?"en":"zh"},emailRedirectTo:siteURL()}});
 if(error){S.busyAuth=false;btn.disabled=false;btn.textContent=lab;toast(/registered|exists/i.test(error.message)?L("这个邮箱已经注册过，请直接登录","This email is already registered. Please log in."):L("注册没成功：","Sign-up failed: ")+error.message);return}
 if(data.session){await loadMe(data.user);await loadAll();S.busyAuth=false;if(pd.role==="user"){finishOnb();toast(T("欢迎来到商链！"))}else openOnb("ok");return}
 S.busyAuth=false;S.pendEmail=email;openOnb("mail")}
async function loginFlow(){const email=$("#lem").value.trim(),password=$("#lpw").value,btn=document.querySelector("#onb .submit");btn.disabled=true;btn.textContent=L("登录中…","Logging in…");
 S.busyAuth=true;const {data,error}=await sb.auth.signInWithPassword({email,password});
 if(error){S.busyAuth=false;btn.disabled=false;btn.textContent=T("登录");toast(/confirm/i.test(error.message)?L("邮箱还没确认，请先点确认邮件里的链接","Please confirm your email first — tap the link we sent you."):L("邮箱或密码不对","Wrong email or password"));return}
 await loadMe(data.user);await loadAll();S.busyAuth=false;finishOnb();toast(T("欢迎回来，")+S.me.name)}
async function forgotFlow(){const email=($("#lem")||{}).value;if(!email||!email.includes("@")){toast(L("先在上面填好邮箱","Enter your email above first"));return}
 const {error}=await sb.auth.resetPasswordForEmail(email.trim(),{redirectTo:siteURL()});toast(error?L("发送没成功：","Couldn’t send: ")+error.message:L("重设密码的邮件已发出，请查收","Password reset email sent"))}
function openReset(){openSheet(`<div class="sbar"><button class="back" data-close>‹ ${L("取消","Cancel")}</button><span style="font-size:12px;color:var(--muted)">${L("设置新密码","New password")}</span></div>
 <form id="rpf"><label>${L("新密码（至少 6 位）","New password (at least 6 characters)")}<input type="password" id="rpw" minlength="6" required autocomplete="new-password"></label><button class="submit" type="submit">${L("保存新密码","Save new password")}</button></form>`)}
async function logoutFlow(){await sb.auth.signOut();S.uid=null;S.me=GUEST();closeSheet();S.nav="brands";await loadAll();render();toast(L("已退出登录","Logged out"))}
async function cUploadDoc(file){try{const path=await upVerify(file);const {error}=await sb.from("verification_requests").update({doc_path:path}).eq("id",S.myVer.id);if(error)throw error;S.myVer.doc_path=path;toast(L("认证材料已上传","Document uploaded"));openSettings()}catch(e){cloudErr(e,"上传")}}

// ── start ──
(async()=>{let ok=false;try{ok=await cloudInit()}catch(e){console.warn("cloud init",e)}
 render();
 if(!S.onb)openOnb("0");
 const m=location.hash.match(/^#([bp])\/(.+)$/);if(m){const id=decodeURIComponent(m[2]);if(m[1]==="b"&&B(id))openBrand(id);else if(m[1]==="p"&&posts().some(x=>x.id===id))openPost(id)}})();

</script>
