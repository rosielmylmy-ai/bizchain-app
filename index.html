<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="商链">
<title>商链 BizChain</title>
<style>
/* Layout: phone-shaped app column — sticky top bar, two-column note feed, bottom tab bar; brand data opens as a full sheet */
:root{
  --bg:#f6f5f2; --surface:#ffffff; --ink:#1b1d24; --muted:#6c6b73; --line:#e6e3dc;
  --gold:#a8843f; --seal:#c2412d; --chip:#efe9dc; --good:#2f7a4f; --goodbg:#e3f1e8;
  --display:"Noto Serif SC","Songti SC",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121317; --surface:#1c1d23; --ink:#ecebe7; --muted:#9a99a2; --line:#2c2d35;
  --gold:#d2ae68; --seal:#e66a52; --chip:#2a2720; --good:#6cc28f; --goodbg:#1f3328; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121317; --surface:#1c1d23; --ink:#ecebe7; --muted:#9a99a2; --line:#2c2d35;
  --gold:#d2ae68; --seal:#e66a52; --chip:#2a2720; --good:#6cc28f; --goodbg:#1f3328; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);padding-inline:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;background:var(--bg);position:relative;padding-bottom:84px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 16px 8px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brandrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.logo{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;display:flex;align-items:baseline;gap:8px}
.logo small{font-family:var(--mono);font-size:11px;color:var(--gold);letter-spacing:.12em}
.search{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
.search input{border:0;background:none;flex:1;min-width:0;font:inherit;color:var(--ink);outline:none}
.tabs{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:4px 0;color:var(--muted);white-space:nowrap;font-size:15px;border-bottom:2px solid transparent}
.tabs button[aria-pressed="true"]{color:var(--ink);font-weight:700;border-color:var(--seal)}
main{padding:12px 10px}
.feed{columns:2;column-gap:8px}
.card{break-inside:avoid;margin-bottom:8px;background:var(--surface);border-radius:10px;overflow:hidden;display:block;width:100%;text-align:left}
.cover{padding:16px 14px;display:flex;flex-direction:column;justify-content:flex-end;font-family:var(--display);font-weight:900;line-height:1.25;color:#fff;font-size:19px;text-wrap:balance}
.cover .kicker{font-family:var(--mono);font-size:10px;letter-spacing:.14em;opacity:.8;margin-bottom:6px;font-weight:500}
.cbody{padding:10px 10px 12px;display:flex;flex-direction:column;gap:8px}
.ctitle{font-weight:500;font-size:13.5px;line-height:1.45}
.bchip{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:var(--chip);color:var(--gold);font-size:11.5px;padding:3px 8px;border-radius:6px;font-weight:500}
.bchip b{font-family:var(--mono);font-weight:500}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.av{display:inline-flex;align-items:center;gap:6px;min-width:0}
.av i{width:18px;height:18px;border-radius:50%;display:inline-block;background:var(--gold);flex:none}
.av span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav{position:fixed;bottom:0;left:0;right:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav div{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;height:58px}
.nav button{font-size:13px;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--ink);font-weight:700}
.nav .plus{justify-self:center;width:46px;height:32px;border-radius:9px;background:var(--seal);color:#fff;font-size:22px;line-height:1}
.note{font-size:11.5px;color:var(--muted);text-align:center;padding:14px 8px 4px}
/* brand list */
.blist{display:flex;flex-direction:column;gap:8px}
.brow{background:var(--surface);border-radius:12px;padding:14px;display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;width:100%}
.mono{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-family:var(--display);font-weight:900;color:#fff;font-size:18px}
.brow h3{margin:0;font-size:15px}
.brow p{margin:3px 0 0;color:var(--muted);font-size:12px}
.brow .fig{font-family:var(--mono);font-size:12px;text-align:right;color:var(--ink)}
.brow .fig small{display:block;color:var(--muted);font-family:var(--body);font-size:11px}
.filters{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -10px 10px;padding:2px 10px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;padding:5px 12px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap}
.fwrap{position:relative}
.filters{cursor:grab;user-select:none}
.farrow{position:absolute;top:0;height:32px;width:44px;display:flex;align-items:center;font-size:20px;color:var(--ink);z-index:1}
.farrow.r{right:-10px;justify-content:flex-end;padding-right:8px;background:linear-gradient(to right,transparent,var(--bg) 55%)}
.farrow.l{left:-10px;justify-content:flex-start;padding-left:8px;background:linear-gradient(to left,transparent,var(--bg) 55%)}
.filters button small{font-family:var(--mono);font-size:10.5px;margin-left:4px;opacity:.7}
.filters button[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:500}
/* sheets */
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto}
.sheet .inner{max-width:480px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 8px) 16px 40px}
.sbar{display:flex;align-items:center;justify-content:space-between;padding:6px 0 12px}
.back{font-size:15px;color:var(--muted)}
.hero{border-radius:14px;padding:20px 18px;color:#fff;display:flex;flex-direction:column;gap:6px}
.hero h2{margin:0;font-family:var(--display);font-weight:900;font-size:26px}
.hero p{margin:0;opacity:.85;font-size:13px}
.follow{align-self:flex-start;margin-top:6px;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;padding:5px 14px;font-size:13px}
.prof{background:var(--surface);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.prow{display:grid;grid-template-columns:60px 1fr auto;gap:12px;align-items:center}
.pav{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:900;font-size:24px}
.pid{min-width:0}.pid h2{margin:0;font-family:var(--display);font-weight:900;font-size:21px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pid p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.prof .follow{background:var(--seal);color:#fff;margin:0;align-self:center}
.pstats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center}
.pstats b{display:block;font-family:var(--mono);font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstats span{font-size:11px;color:var(--muted)}
.pbio{font-size:13.5px;line-height:1.65;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pbio.open{display:block}
.more{align-self:flex-start;font-size:12.5px;color:var(--gold);margin-top:-6px}
.ptags{display:flex;flex-wrap:wrap;gap:6px}.ptags span{font-size:12px;color:var(--gold);background:var(--chip);padding:2px 8px;border-radius:999px}
.ptags .src{color:var(--muted);background:transparent;border:1px solid var(--line)}
.jump{position:sticky;top:0;z-index:2;display:flex;gap:18px;background:var(--bg);padding:12px 2px 8px;margin-top:6px;border-bottom:1px solid var(--line);overflow-x:auto}
.jump button{color:var(--muted);font-size:14.5px;white-space:nowrap;padding:4px 0;border-bottom:2px solid transparent}.jump button[aria-selected="true"]{color:var(--ink);font-weight:700;border-color:var(--seal)}
.bpanel{margin-top:4px}
.sec{scroll-margin-top:52px}
.trend{background:var(--surface);border-radius:12px;padding:14px}
.bars{display:grid;grid-template-columns:repeat(4,1fr);align-items:end;gap:10px;height:120px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%}
.bar i{display:block;width:60%;max-width:46px;background:var(--gold);border-radius:4px 4px 0 0;opacity:.55}
.bar:last-child i{opacity:1}
.bv{font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}.by{font-family:var(--mono);font-size:11px;color:var(--muted)}
.tsum{margin:10px 0 0;font-size:13px}.tsum.up b{color:var(--good)}.tsum.down b{color:var(--seal)}
.rev{background:var(--surface);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rev p{margin:0;font-size:14px;line-height:1.6}
.pill{align-self:flex-start;font-size:12px;padding:3px 10px;border-radius:999px;font-weight:500}
.rev.yes .pill{background:var(--goodbg);color:var(--good)}.rev.no .pill{background:var(--chip);color:var(--seal)}
.sim{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.simc{background:var(--surface);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0}
.simc .mono{width:32px;height:32px;font-size:14px;border-radius:8px;margin-bottom:4px}
.simc b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.simc span{font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpis div{display:flex;flex-direction:column;gap:2px}.kpis span{font-size:12px;color:var(--muted)}
.kpis b{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}.kpis small{font-family:var(--mono);font-size:11px;color:var(--muted)}
.range{display:flex;flex-direction:column;gap:6px;margin-top:4px}
.track{position:relative;height:10px;border-radius:999px;background:linear-gradient(to right,var(--chip),var(--gold))}
.mk{position:absolute;top:-4px;width:4px;height:18px;border-radius:2px;transform:translateX(-50%)}
.mk.avg,.dot.avg{background:var(--ink)}.mk.med,.dot.med{background:var(--seal)}
.rlab{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}.legend span{display:flex;align-items:center;gap:5px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.above{margin:0;font-size:13px}.basis{margin:0;font-size:12px;color:var(--muted)}
.gt{margin:16px 0 8px;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.dist{background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.drow{display:grid;grid-template-columns:78px 1fr 34px;gap:8px;align-items:center;font-size:12.5px}
.db{height:10px;background:var(--chip);border-radius:3px;overflow:hidden}.db i{display:block;height:100%;background:var(--gold)}
.dn{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.prof{padding:0 0 16px;overflow:hidden}
.prof>*:not(.pcover){margin-inline:16px}
.pcover{height:110px;background-size:cover;background-position:center;position:relative;margin:0}
.pedit{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.42);color:#fff;font-size:12px;padding:4px 10px;border-radius:999px}
.prof .prow{margin-top:-6px;align-items:end}
.prof .prow .pav{margin-top:-34px;position:relative;z-index:1}
.prof .prow .pid,.prof .prow .follow{padding-bottom:2px}
.pav{border:3px solid var(--surface);box-sizing:content-box}
.avimg{background-size:cover;background-position:center;color:transparent}
.idea{background:var(--surface);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:12px}
.idea blockquote{margin:0;font-family:var(--display);font-weight:900;font-size:19px;line-height:1.45;text-wrap:balance;border-left:3px solid var(--seal);padding-left:12px}
.vals{display:flex;flex-wrap:wrap;gap:6px}.vals span{background:var(--chip);color:var(--gold);font-size:13px;padding:4px 10px;border-radius:999px}
.story{font-size:14.5px;line-height:1.8;white-space:pre-wrap}.byb{margin:0;font-size:11.5px;color:var(--muted)}
.ideaempty{background:var(--surface);border-radius:12px;padding:20px 16px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.ideaempty p{margin:0;font-size:13.5px;color:var(--muted);line-height:1.6}.ideaempty .dm{margin-top:4px}
.edcover{height:120px;border-radius:12px;background-size:cover;background-position:center;position:relative}
.pick{position:absolute;right:10px;bottom:10px;background:rgba(0,0,0,.5);color:#fff;font-size:12.5px;padding:5px 12px;border-radius:999px;cursor:pointer;flex-direction:row}
.edav{display:flex;align-items:center;gap:12px;margin-top:-34px;padding-left:12px;position:relative;z-index:1}
.edav .pick{position:static}.pick.dark{background:var(--ink);color:var(--bg);margin-top:28px}
.edh{margin:8px 0 0;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.sec{margin-top:18px}
.sec h4{margin:0 0 8px;font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:500}
.items{background:var(--surface);border-radius:12px;overflow:hidden}
.item{display:flex;flex-direction:column;gap:4px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ihead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.isub{color:var(--muted);font-size:12px}
.item:last-child{border-bottom:0}
.item .no{font-family:var(--mono);font-size:10.5px;color:var(--gold);letter-spacing:.06em;flex:none}
.item .lab{font-size:13px;color:var(--muted)}
.item .lab small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}
.item .val{font-size:15.5px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.4;word-break:break-word}
.states{display:flex;flex-wrap:wrap;gap:6px}
.states span{font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:6px;background:var(--chip);color:var(--gold)}
.warn{font-size:12px;color:var(--muted);line-height:1.6;margin-top:10px}
.post h1{font-size:19px;line-height:1.4;margin:14px 0 8px;text-wrap:balance}
.post .txt{font-size:15px;line-height:1.75;white-space:pre-wrap}
.post .bigcover{border-radius:12px;min-height:220px;font-size:26px}
.linkcard{margin-top:16px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center}
.linkcard .mono{width:40px;height:40px;font-size:16px}
.linkcard small{color:var(--muted);font-size:12px;display:block}
.linkcard .go{color:var(--gold);font-size:13px}
form{display:flex;flex-direction:column;gap:12px}
label{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
input[type=text],textarea,select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:140px;resize:vertical;line-height:1.6}
.swatches{display:flex;gap:8px}
.swatches button{width:30px;height:30px;border-radius:8px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink)}
.submit{background:var(--seal);color:#fff;border-radius:10px;padding:12px;font-weight:700}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:20}
.me{background:var(--surface);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.me h2{margin:0;font-family:var(--display);font-size:20px}
.empty{color:var(--muted);text-align:center;padding:40px 10px;font-size:13.5px}
.tlist{display:flex;flex-direction:column;background:var(--surface);border-radius:12px;overflow:hidden}
.trow{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.trow:last-child{border-bottom:0}
.trow .ava{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700}
.trow b{font-size:14.5px;font-weight:500}
.trow p{margin:3px 0 0;color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.trow span:nth-child(2){min-width:0}
.trow time{font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--seal);margin-left:6px;vertical-align:middle}
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:80px}
.bub{max-width:78%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.bub.them{background:var(--surface);align-self:flex-start;border-top-left-radius:4px}
.bub.me{background:var(--ink);color:var(--bg);align-self:flex-end;border-top-right-radius:4px}
.ctx{align-self:center;font-size:11.5px;color:var(--muted)}
.chat .linkcard{margin:0;max-width:86%;align-self:flex-start}
.composer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.composer form{max-width:448px;margin:0 auto;flex-direction:row;gap:8px}
.composer input{flex:1;min-width:0;border-radius:999px}
.composer button{background:var(--seal);color:#fff;border-radius:999px;padding:0 16px;font-weight:500}
.dm{font-size:14px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
@media (prefers-reduced-motion:no-preference){.card,.brow{transition:transform .15s}.card:active,.brow:active{transform:scale(.98)}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div class="brandrow">
      <div class="logo">商链 <small>BIZCHAIN</small></div>
    </div>
    <div class="search"><span aria-hidden="true">⌕</span><input id="q" type="text" placeholder="搜品牌、FDD条款、话题" aria-label="搜索"></div>
    <nav class="tabs" id="feedTabs" aria-label="频道"></nav>
  </header>
  <main id="view"></main>
</div>

<nav class="nav" aria-label="主导航"><div>
  <button data-go="brands" aria-current="page">品牌库</button>
  <button data-go="feed">发现</button>
  <button data-go="compose" class="plus" aria-label="发布笔记">+</button>
  <button data-go="msgs">私信</button>
  <button data-go="me">我的</button>
</div></nav>

<div class="sheet" id="sheet" hidden><div class="inner" id="sheetIn"></div></div>
<div class="toast" id="toast" hidden></div>

<script>

function cardHTML(p){const b=p.brand&&B(p.brand);const h=[150,190,170,210][p.id.length%4+ (p.title.length%2)]||180;
 return `<button class="card" data-post="${p.id}">
  <div class="cover" style="background:${COLORS[p.c]};min-height:${h}px"><span class="kicker">${esc(p.kicker||"NOTE")}</span>${esc(p.cover).replace(/\n/g,"<br>")}</div>
  <div class="cbody"><div class="ctitle">${esc(p.title)}</div>
  ${b?`<span class="bchip">${esc(b.name)} · 加盟费 <b>${esc(b.fee.split("（")[0])}</b></span>`:""}
  <div class="meta"><span class="av"><i style="background:${COLORS[(p.user.length)%6]}"></i><span>${esc(p.user)}</span></span><span>♡ ${p.likes}</span></div></div></button>`}

function renderTabs(){const t=["推荐","投资人","品牌方","法规"];
 $("#feedTabs").innerHTML=t.map(x=>`<button aria-pressed="${S.tab===x}" data-tab="${x}">${x}</button>`).join("");
 $("#feedTabs").hidden=S.nav!=="feed"}

function render(){renderTabs();
 document.querySelectorAll(".nav button").forEach(b=>{if(b.dataset.go===S.nav)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")});
 const q=S.q.trim().toLowerCase(),v=$("#view");
 if(S.nav==="feed"){let list=posts().filter(p=>S.tab==="推荐"||p.ch===S.tab);
  if(q)list=list.filter(p=>(p.title+p.body+(p.brand?B(p.brand).name:"")).toLowerCase().includes(q));
  v.innerHTML=list.length?`<div class="feed">${list.map(cardHTML).join("")}</div><p class="note">品牌数据摘自 2026 年 FDD，签约前请以原文为准</p>`:`<div class="empty">没有找到相关笔记</div>`}
 else if(S.nav==="brands"){const cats=["全部","餐饮","零售","专业服务","家居服务","健康健身","教育艺术","汽车出行","宠物服务","住宿休闲","娱乐休闲","活动服务","体育运动"];
  const n=c=>c==="全部"?BRANDS.length:BRANDS.filter(b=>b.cat===c).length;
  let list=BRANDS.filter(b=>S.brandCat==="全部"||b.cat===S.brandCat);
  if(q)list=list.filter(b=>(b.name+b.cn).toLowerCase().includes(q));
  v.innerHTML=`<div class="fwrap"><button class="farrow l" data-fscroll="-1" aria-label="向左滑" hidden>‹</button><div class="filters" id="filters" role="group" aria-label="行业分类">${cats.map(c=>`<button data-cat="${c}" aria-pressed="${S.brandCat===c}">${c}<small>${n(c)}</small></button>`).join("")}</div><button class="farrow r" data-fscroll="1" aria-label="向右滑">›</button></div>
  <div class="blist">${list.map(b=>`<button class="brow" data-brand="${b.id}">${avHTML(b)}<span><h3>${esc(b.name)}</h3><p>${esc(b.cn)} · ${esc(b.units)}</p></span><span class="fig">${esc(b.fee)}<small>加盟费</small></span></button>`).join("")||`<div class="empty">${q?"没有匹配的品牌":"「"+esc(S.brandCat)+"」还没有收录品牌"}</div>`}</div>
  <p class="note">数据来源：威斯康星州 DFI 备案的 2026 年 FDD · 已收录 ${BRANDS.length} 个品牌</p>`;setupFilters()}
 else if(S.nav==="msgs"){let list=S.threads;if(q)list=list.filter(t=>(t.name+t.msgs.map(m=>m.t).join("")).toLowerCase().includes(q));
  v.innerHTML=list.length?`<div class="tlist">${list.map(t=>{const last=t.msgs[t.msgs.length-1];return `<button class="trow" data-thread="${t.id}"><span class="ava" style="background:${COLORS[t.c]}">${esc(t.name[0])}</span><span><b>${esc(t.name)}</b>${t.unread?'<i class="dot" aria-label="未读"></i>':""}<p>${last?(last.me?"我：":"")+esc(last.t):(t.brand?"咨询 "+esc(B(t.brand).name):"还没有消息")}</p></span><time>${esc(t.time)}</time></button>`}).join("")}</div><p class="note">原型示例对话 · 消息目前只保存在本机浏览器</p>`:`<div class="empty">还没有私信。在笔记或品牌页点「私信」就能发起对话。</div>`}
 else if(S.nav==="me"){v.innerHTML=`<div class="me"><h2>女王</h2><span style="color:var(--muted);font-size:13px">商链 BizChain · 美中跨境特许经营</span><span style="font-size:13px">已发布 ${S.mine.length} 篇 · 私信 ${S.threads.length} 个</span></div>
  ${S.mine.length?`<div class="feed">${S.mine.map(cardHTML).join("")}</div>`:`<div class="empty">你还没有发布笔记，点底部「+」写第一篇。</div>`}`}
}

function openSheet(html){$("#sheetIn").innerHTML=html;$("#sheet").hidden=false;$("#sheet").scrollTop=0}
let filterPos=0;
function setupFilters(){const f=$("#filters");if(!f)return;f.scrollLeft=filterPos;
 const arrows=()=>{filterPos=f.scrollLeft;const max=f.scrollWidth-f.clientWidth;document.querySelector(".farrow.l").hidden=f.scrollLeft<4;document.querySelector(".farrow.r").hidden=f.scrollLeft>max-4};
 f.addEventListener("scroll",arrows);arrows();
 f.addEventListener("wheel",e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){f.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
 let down=false,sx=0,sl=0,moved=false;
 f.addEventListener("pointerdown",e=>{if(e.pointerType!=="mouse")return;down=true;moved=false;sx=e.clientX;sl=f.scrollLeft});
 window.addEventListener("pointermove",e=>{if(!down)return;const dx=e.clientX-sx;if(Math.abs(dx)>5)moved=true;f.scrollLeft=sl-dx});
 window.addEventListener("pointerup",()=>{down=false});
 f.addEventListener("click",e=>{if(moved){e.stopPropagation();e.preventDefault();moved=false}},true)}
function closeSheet(){$("#sheet").hidden=true;S.thread=null}

function openThread(id){const t=S.threads.find(x=>x.id===id);if(!t)return;t.unread=false;persist();S.thread=id;const b=t.brand&&B(t.brand);
 openSheet(`<div class="sbar"><button class="back" data-close>‹ 私信</button><b style="font-size:15px">${esc(t.name)}</b><span style="width:48px"></span></div>
 <div class="chat" id="chat">${b?`<span class="ctx">对方在看这个品牌</span><button class="linkcard" data-brand="${b.id}">${avHTML(b)}<span><b>${esc(b.name)}</b><small>加盟费 ${esc(b.fee)} · 投资 ${esc(b.invest)}</small></span><span class="go">FDD ›</span></button>`:""}
 ${t.msgs.length?t.msgs.map(m=>`<div class="bub ${m.me?"me":"them"}">${esc(m.t)}</div>`).join(""):`<span class="ctx">打个招呼吧</span>`}</div>
 <div class="composer"><form id="mf"><input type="text" id="mi" placeholder="发消息…" aria-label="消息" autocomplete="off" required><button type="submit">发送</button></form></div>`);
 $("#sheet").scrollTop=$("#sheet").scrollHeight}

function avHTML(b,cls="mono"){const x=B(b.id)||b;return x.avatar?`<span class="${cls} avimg" style="background-image:url('${x.avatar}')" role="img" aria-label="${esc(x.name)} 头像"></span>`:`<span class="${cls}" style="background:${COLORS[x.c]}">${esc(x.name[0])}</span>`}
function lowInvest(v){const m=String(v).match(/\$[\d,]+/);if(!m)return "—";const n=+m[0].replace(/[$,]/g,"");return n>=10000?"$"+Math.round(n/10000)+"万":m[0]}
function trendHTML(b){const t=b.units_trend;if(!t)return `<p class="warn">暂无数据</p>`;const ys=Object.keys(t),vs=ys.map(y=>t[y]),mx=Math.max(...vs);const d=vs[3]-vs[2],pct=vs[2]?Math.round(d/vs[2]*1000)/10:0;
 return `<div class="trend"><div class="bars">${ys.map((y,i)=>`<div class="bar"><span class="bv">${vs[i].toLocaleString()}</span><i style="height:${Math.max(6,Math.round(vs[i]/mx*72))}px"></i><span class="by">${y}</span></div>`).join("")}</div><p class="tsum ${d>=0?"up":"down"}">2025 年净${d>=0?"增加":"减少"} <b>${Math.abs(d).toLocaleString()}</b> 家（${d>=0?"+":""}${pct}%）</p></div><p class="warn">年底门店总数，含加盟店和直营店。</p>`}
function simHTML(b){const list=BRANDS.filter(x=>x.cat===b.cat&&x.id!==b.id).slice(0,4);if(!list.length)return `<p class="warn">这个分类还没有其他品牌</p>`;
 return `<div class="sim">${list.map(x=>`<button class="simc" data-brand="${x.id}">${avHTML(x)}<b>${esc(x.name)}</b><span>加盟费 ${esc(x.fee.split("（")[0])}</span><span>投资起步 ${esc(lowInvest(x.invest))}</span><span>门店 ${esc(x.units)}</span></button>`).join("")}</div>`}
function wan(n){if(n==null)return "—";return "$"+(n>=1e6?(n/1e4).toFixed(0):(n/1e4).toFixed(1))+"万"}
function full(n){return n==null?"":"$"+n.toLocaleString("en-US")}
function revHTML(b){const d=b.item19_detail;
 if(!d){return `<div class="rev no"><span class="pill">未披露收入</span><p>品牌没有在 FDD 里公布门店收入。</p></div><p class="warn">投资前需要自己找现有加盟商了解实际营业额，FDD 的 Item 20 和附件里有现有加盟商的联系方式。</p>`}
 if(d.forecast){return `<div class="rev no"><span class="pill">只有预测工具</span><p>${esc(d.forecast)}</p></div>`}
 const s=d.summary||{};let h=`<div class="rev yes"><span class="pill">已披露 · ${esc(d.metric)} · ${esc(d.period)}</span>
 <div class="kpis"><div><span>平均</span><b>${wan(s.avg)}</b><small>${full(s.avg)}</small></div>${s.median!=null?`<div><span>中位数</span><b>${wan(s.median)}</b><small>${full(s.median)}</small></div>`:""}</div>`;
 if(s.low!=null&&s.high!=null){const pos=v=>Math.max(0,Math.min(100,(v-s.low)/(s.high-s.low)*100));
  h+=`<div class="range" role="img" aria-label="最低 ${full(s.low)}，最高 ${full(s.high)}"><div class="track"><i class="mk med" style="left:${pos(s.median??s.avg)}%" title="中位数"></i><i class="mk avg" style="left:${pos(s.avg)}%" title="平均"></i></div>
  <div class="rlab"><span>最低 ${wan(s.low)}</span><span>最高 ${wan(s.high)}</span></div><div class="legend"><span><i class="dot avg"></i>平均</span>${s.median!=null?`<span><i class="dot med"></i>中位数</span>`:""}</div></div>`}
 h+=`<p class="above">高于平均的门店：<b>${esc(s.above||"—")}</b></p><p class="basis">统计范围：${esc(d.basis)}</p></div>`;
 if(d.groups&&d.groups.length){h+=`<h5 class="gt">${esc(d.group_title)}</h5><div class="items grp">${d.groups.map(g=>`<div class="item"><div class="ihead"><span class="lab">${esc(g.label)}${g.n?` · ${g.n.toLocaleString()} 家`:""}</span><span class="no">中位 ${wan(g.median)}</span></div><div class="val">平均 ${wan(g.avg)}</div><small class="isub">区间 ${wan(g.low)} – ${wan(g.high)}</small></div>`).join("")}</div>`}
 if(d.dist){const mx=Math.max(...d.dist.map(x=>x[1]));h+=`<h5 class="gt">${esc(d.group_title)}</h5><div class="dist">${d.dist.map(([l,n])=>`<div class="drow"><span class="dl">${esc(l)}</span><span class="db"><i style="width:${Math.max(2,n/mx*100)}%"></i></span><span class="dn">${n}</span></div>`).join("")}</div>`}
 return h+`<p class="warn">以上是营业额，不是利润。租金、人工、食材和加盟费都还没扣。</p>`}
function ideaHTML(b){const ph=b.philosophy;
 if(!ph||!(ph.mission||ph.story||(ph.values&&ph.values.length)))return `<div class="ideaempty"><b>${esc(b.name)} 还没有填写品牌理念</b><p>品牌入驻商链后，可以在这里讲品牌故事、使命和价值观，让投资人了解品牌想找什么样的合作伙伴。</p><button class="dm" data-bedit="${b.id}">我是品牌方，去填写</button></div>`;
 return `<div class="idea">${ph.mission?`<blockquote>${esc(ph.mission)}</blockquote>`:""}${ph.values&&ph.values.length?`<div class="vals">${ph.values.map(v=>`<span>${esc(v)}</span>`).join("")}</div>`:""}${ph.story?`<div class="story">${esc(ph.story)}</div>`:""}<p class="byb">由品牌方填写</p></div>`}
function shrink(file,w,h,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");c.width=w;c.height=h;const k=Math.max(w/im.width,h/im.height),dw=im.width*k,dh=im.height*k;c.getContext("2d").drawImage(im,(w-dw)/2,(h-dh)/2,dw,dh);cb(c.toDataURL("image/jpeg",.82))};im.onerror=()=>toast("这张图片打不开，换一张试试");im.src=r.result};r.readAsDataURL(file)}

 <label>正文<textarea id="fb" required placeholder="分享你的看法、经历或FDD解读"></textarea></label>
 <label>关联品牌（读者可一键查看FDD）<select id="fbr"><option value="">不关联</option>${BRANDS.map(b=>`<option value="${b.id}" ${b.id===pre?"selected":""}>${esc(b.name)}</option>`).join("")}</select></label>
 <label>频道<select id="fch"><option>投资人</option><option>品牌方</option><option>法规</option></select></label>
 <button class="submit" type="submit">发布</button></form>`)}

document.addEventListener("click",e=>{const t=e.target.closest("button");if(!t)return;const d=t.dataset;
 if(d.bedit){openBrandEdit(d.bedit);return}
 if(d.breset){delete S.edits[d.breset];persist();openBrand(d.breset);render();toast("已恢复默认");return}
 if(d.btab){document.querySelectorAll("[data-btab]").forEach(x=>x.setAttribute("aria-selected",x===t));document.querySelectorAll("[data-panel]").forEach(x=>x.hidden=x.dataset.panel!==d.btab);return}
 if(d.fscroll){const f=$("#filters");f.scrollBy({left:+d.fscroll*220,behavior:"smooth"});return}
 if(d.tab){S.tab=d.tab;render()}
 else if(d.go){if(d.go==="compose"){openCompose();return}S.nav=d.go;closeSheet();render();window.scrollTo(0,0)}
 else if(d.cat){S.brandCat=d.cat;render()}
 else if(d.brand)openBrand(d.brand);
 else if(d.post)openPost(d.post);
 else if("close" in d)closeSheet();
 else if(d.compose)openCompose(d.compose);
 else if(d.thread)openThread(d.thread);
 else if(d.dm){const p=posts().find(x=>x.id===d.dm);const t=threadFor(p.user,p.user.length%6,p.brand);persist();render();openThread(t.id)}
 else if(d.ask){const t=threadFor("商链顾问",4,d.ask);persist();render();openThread(t.id)}
 else if(d.sw){S.color=+d.sw;document.querySelectorAll("[data-sw]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sw===d.sw))}
 else if("bio" in d){const el=$("#pbio"),o=el.classList.toggle("open");t.textContent=o?"收起":"展开";t.setAttribute("aria-expanded",o)}
 else if(d.toast)toast(d.toast)});
document.addEventListener("submit",e=>{if(e.target.id==="bef"){e.preventDefault();const id=e.target.dataset.id;
  S.edits[id]={avatar:S.draft.avatar||undefined,cover:S.draft.cover||undefined,tagline:$("#etag").value.trim(),bio:$("#ebio").value.trim(),philosophy:{mission:$("#emis").value.trim(),values:$("#eval").value.split("\n").map(x=>x.trim()).filter(Boolean),story:$("#esto").value.trim()}};
  persist();render();openBrand(id);toast("已保存");return}
 if(e.target.id==="mf"){e.preventDefault();const t=S.threads.find(x=>x.id===S.thread),v=$("#mi").value.trim();if(!t||!v)return;
  t.msgs.push({me:true,t:v});t.time="刚刚";S.threads=[t,...S.threads.filter(x=>x!==t)];persist();render();openThread(t.id);$("#mi").focus();return}
 if(e.target.id!=="cf")return;e.preventDefault();
 const p={id:"m"+Date.now(),ch:$("#fch").value,brand:$("#fbr").value||null,c:S.color,kicker:"NOTE",cover:$("#fc").value.trim(),title:$("#ft").value.trim(),body:$("#fb").value.trim(),user:"女王 · 商链",likes:0};
 S.mine.unshift(p);persist();closeSheet();S.nav="feed";S.tab="推荐";render();window.scrollTo(0,0);toast("已发布")});
$("#q").addEventListener("input",e=>{S.q=e.target.value;if(S.nav!=="feed"&&S.nav!=="brands")S.nav="brands";render()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet()});
render();
</script>

</body>
</html>
